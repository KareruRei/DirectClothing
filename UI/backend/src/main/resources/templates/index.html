<style>
    body {
    font-family: 'calibri';
    padding: 20px;
}
.container{
    margin: auto;
    text-align: left;
    padding-top: 5px;
}
.title{
    font-size: xx-large;
    font-family: 'Spectral';
    position: fixed;
}
.sidebar {
    position: fixed;
    width: 300px;
    top: 20%;
    left: -3000px; 
    bottom: 0;
    background: #7c7a7a;
    padding: 10px 0;
    transition: left 0.4s ease; 
    height: min-content;
    border-radius: 12px;
    box-shadow: 10px 11px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
    line-height: 25px;
}
.sidebar h1{
    font-size: xx-large;
    font-family: 'spectral';
    color: whitesmoke;
    margin-left: 10px;
}
.sidebar a{
    display: list-item;
    font-size: x-large;
    font-family: 'spectral';
    color: #FFF;
    margin-left: 25px;
    list-style: none;
    padding: 10px 5px;
    text-decoration-style: none;
}
.sidebar a:hover{
    color: #fff;
    margin-left: 20px;
    transition: 0.4s;
 }
.show {
    left: 0;
}

button {
    position: fixed;
    right: 30px;
    top: 30px;
    background: #111;
    padding: 10px;
    border-radius: 50%;
    outline: none;
    border: none;
    cursor: pointer;
    z-index: 1000;
}

button span {
    height: 3px;
    width: 20px;
    display: block;
    margin: 6px;
    background: #FFF;
}

input {
    display: none;
}

.container1 {
    width: 100%;
    height: 100vh; 
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    flex-direction: column;
    position: relative;
}

.cards {
    position: relative;
    height: 500px;
    width: 430px;
    margin: auto; 
    perspective: 1000px;
    transform-style: preserve-3d;
    display: flex;
    justify-content: center;
    align-items: center;
}
.carousel-buttons {
    position: absolute;
    width: 100%;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 20;
    pointer-events: none; 
}

.carousel-buttons button {
    background-color: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    padding: 10px 15px;
    font-size: 20px;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.3s ease;
    pointer-events: all; 
}

.carousel-buttons button:hover {
    background-color: rgba(0, 0, 0, 0.8);
}


#prevBtn {
    position: relative;
    left: -50px; 
}

#nextBtn {
    position: absolute;
    right: -30px; 
}


.cards label {
    position: absolute;
    width: 100%;
    left: 0;
    right: 0;
    margin: auto;
    cursor: pointer;
    transition: transform 0.55s ease;
    display: flex;
    justify-content: center;
}

.cards .card {
    position: relative;
    width: 100%;
    height: 100%;
    background-color: rgb(158, 154, 154);
    border-radius: 10px;
    padding: 30px 35px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.cards .image {
    display: flex;
    align-items: center;
}

.cards .image img {
    border-radius: 5px;
    box-shadow: 15px 15px 40px rgba(0, 0, 0, 50%);
    margin-top: 23px;
    width: 100%;
    height: 300px;
    object-fit: cover;
    transition: all .5s;
}

.cards .image img:hover {
    transform: scale(1.05);
}

.cards .image {
    display: flex;
    justify-content: flex-end; /* Moves content to the right */
}

.cards .image .dots {
    display: flex;
    flex-direction: column; /* Stack dots vertically */
    align-items: flex-end; /* Align dots to the right */
}

.dots div {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    margin-bottom: 10px; 
}

.dots div:nth-child(1) {
    background-color: white;
}

.dots div:nth-child(2) {
    background-color: red;
}

.dots div:nth-child(3) {
    background-color: green;
}

.card .infos{
    display: inline-block;
    text-align: right;
}

.card .infos span{
    display: block;
}

.card .name{
    font-size: 30px;
    color: var(--current-color1);
}
.card .actions {
    display: flex;
    justify-content: space-evenly;
    align-items: cen    ter;
    padding-top: 50px;
}

#s1:checked ~ .cards #slider4,
#s2:checked ~ .cards #slider5,
#s3:checked ~ .cards #slider1,
#s4:checked ~ .cards #slider2,
#s5:checked ~ .cards #slider3 {
    transform: translate3d(-70%, 0, -220px);
    opacity: 0.5;
}

#s1:checked ~ .cards #slider5,
#s2:checked ~ .cards #slider1,
#s3:checked ~ .cards #slider2,
#s4:checked ~ .cards #slider3,
#s5:checked ~ .cards #slider4 {
    transform: translate3d(-35%, 0, -120px);
    opacity: 0.7;
}

#s1:checked ~ .cards #slider1,
#s2:checked ~ .cards #slider2,
#s3:checked ~ .cards #slider3,
#s4:checked ~ .cards #slider4,
#s5:checked ~ .cards #slider5 {
    transform: translate3d(0, 0, 0);
    opacity: 1;
    z-index: 10;
}

#s1:checked ~ .cards #slider2,
#s2:checked ~ .cards #slider3,
#s3:checked ~ .cards #slider4,
#s4:checked ~ .cards #slider5,
#s5:checked ~ .cards #slider1 {
    transform: translate3d(35%, 0, -120px);
    opacity: 0.7;
}

#s1:checked ~ .cards #slider3,
#s2:checked ~ .cards #slider4,
#s3:checked ~ .cards #slider5,
#s4:checked ~ .cards #slider1,
#s5:checked ~ .cards #slider2 {
    transform: translate3d(70%, 0, -220px);
    opacity: 0.5;
}

</style>

    <script>
        function showSidebar() {
    var sidebar = document.getElementById('sidebar');

    if (sidebar.classList.contains("show")) {
        sidebar.classList.remove("show"); // Hide sidebar
    } else {
        sidebar.classList.add("show"); // Show sidebar
    }
}
document.addEventListener("DOMContentLoaded", function () {
    let currentIndex = 0;
    const totalSlides = 5; // Update this based on the number of slides
    const radioButtons = document.querySelectorAll("input[name='slider']");

    document.getElementById("prevBtn").addEventListener("click", function () {
        currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
        radioButtons[currentIndex].checked = true;
    });

    document.getElementById("nextBtn").addEventListener("click", function () {
        currentIndex = (currentIndex + 1) % totalSlides;
        radioButtons[currentIndex].checked = true;
    });
});

    </script>
