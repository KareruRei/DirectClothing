<!DOCTYPE html>
<html lang="en" xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Clothing</title>
    <link rel="stylesheet" href="/catalog.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
</head>
<body>
    <header>
        <div class="logo">Direct Clothing</div>
        <div class="icons">
            <span><a href="#"><i class="fa far fa-user-circle"></i></a></span>
            <span><a href="#"><i class="fa fa-file"></i></a></span>
            <span onclick="openCart()" style="position: relative; cursor: pointer;">
                <i class="fa fas fa-shopping-bag"></i>
                <span id="cart-count" class="cart-count">0</span>
            </span>
        </div>
    </header>
    
    <div id="cart-ui" class="cart-ui">
        <div class="cart-content">
            <span class="close-cart" onclick="closeCart()">&times;</span>
            <h2>Your Cart</h2>
            <div id="cart-items"></div>
            <button><a href="/shopping-bag">Checkout</a></button>
        </div>
    </div>

    <section class="bestsellers">
        <h2>Normal Items</h2>
        <div class="products">
            <div
            th:each="catalogItem : ${normalItems}"
            class="product"
            th:data-itemSKU="${catalogItem.getSKU()}"
            th:data-imageLink="@{'/' + ${catalogItem.getProduct().getImageLink()}}"
            th:data-description="${catalogItem.getProduct().getDescription()}"
            th:data-price="${catalogItem.getPrice()}"
            th:onclick="openPopup(this.getAttribute('data-itemSKU'), this.getAttribute('data-imageLink'), this.getAttribute('data-description'), this.getAttribute('data-price'))"
            >

                <img th:src="@{'/' + ${catalogItem.getProduct().getImageLink()}}">
                <p th:text="${catalogItem.getProduct().getDescription()}"></p>
                <p th:text="'Php. ' + ${catalogItem.getPrice()}"></p>
            </div>
        </div>

        <h2>Monthly Specials</h2>
        <div class="products">
            <div
            th:each="catalogItem : ${monthlySpecials}"
            class="product"
            th:data-itemSKU="${catalogItem.getSKU()}"
            th:data-imageLink="@{'/' + ${catalogItem.getProduct().getImageLink()}}"
            th:data-description="${catalogItem.getProduct().getDescription()}"
            th:data-price="${catalogItem.getDiscountedPrice()}"
            th:onclick="openPopup(this.getAttribute('data-itemSKU'), this.getAttribute('data-imageLink'), this.getAttribute('data-description'), this.getAttribute('data-price'))">

                <img th:src="@{'/' + ${catalogItem.getProduct().getImageLink()}}">
                <p th:text="${catalogItem.getProduct().getDescription()}"></p>
                <p th:text="'Php. ' + ${catalogItem.getDiscountedPrice()}"></p>
            </div>
        </div>

        <h2>Close-Out Items</h2>
        <div class="products">
            <div
            th:each="catalogItem : ${closeOuts}"
            class="product"
            th:data-itemSKU="${catalogItem.getSKU()}"
            th:data-imageLink="@{'/' + ${catalogItem.getProduct().getImageLink()}}"
            th:data-description="${catalogItem.getProduct().getDescription()}"
            th:data-price="${catalogItem.getDiscountedPrice()}"
            th:onclick="openPopup(this.getAttribute('data-itemSKU'), this.getAttribute('data-imageLink'), this.getAttribute('data-description'), this.getAttribute('data-price'))">

                <img th:src="@{'/' + ${catalogItem.getProduct().getImageLink()}}">
                <p th:text="${catalogItem.getProduct().getDescription()}"></p>
                <p th:text="'Php. ' + ${catalogItem.getDiscountedPrice()}"></p>
            </div>
        </div>
        
        
        <div id="popup" class="popup">
            <div class="popup-content">
                <span class="close" onclick="closePopup()">&times;</span>
                <img id="popup-img" src="" alt="Product Image">
                <h2 id="popup-title"></h2>
                <p id="popup-price"></p>
                <button id="add-to-cart">Add to Cart</button>
            </div>
        </div>
        
    </section>

    <script th:inline="javascript">
        function addToCart(itemID) {
            let title = document.getElementById('popup-title').innerText;
            let price = document.getElementById('popup-price').innerText;
            let image = document.getElementById('popup-img').src;
            
            var catalogKey = [[${catalogKey}]];
            
            fetch("/item-added?catalog=" + catalogKey , {
                method: 'POST', 
                headers: {'Content-Type': 'text/plain',},
                body: itemID
            })
                .then(response => {
                    if (response.ok) {

                        document.getElementById('cart-count').style.display = "inline";

                    } else if (response.status === 500) alert("Item does not exist! Failed to add item to cart.");

                    return response.json();
                })
                .then(cartSize => {
                    if (response.ok) {
                        var cartContainer = document.getElementById('cart-items');
                        cartContainer.innerHTML += `
                            <div class="cart-item">
                                <img src="${image}" alt="${title}">
                                <div>
                                    <p>${title}</p>
                                    <p>${price}</p>
                                    <button onclick="removeFromCart()">Remove</button>
                                </div>
                            </div>
                        `;
                        document.getElementById('cart-count').innerText = cartSize;
                    }
                })

            closePopup();
        }
    </script>
    <script src="/catalog.js"></script>

</body>
</html>
