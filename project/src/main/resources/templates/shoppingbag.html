<!DOCTYPE html>
<html lang="en" xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Out</title>
    <link rel="stylesheet" href="shoppingbag.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header>
        <div class="logo"><a href="/">Direct Clothing</a></div>
        <div class="icons">
            <span><a href="#"><i class="fa far fa-user-circle"></i></a></span>
            <span><a href="#"><i class="fa fa-file"></i></a></span>
            <span id="mini-cart-button" onclick="openCart()" style="position: relative; cursor: pointer;">
                <i class="fa fas fa-shopping-bag"></i>
                <span id="cart-count" class="cart-count" th:text="${cartSize}" th:style="${cartSize == 0 ? 'display: none;' : 'display: inline;'}"></span>
            </span>
        </div>
    </header>
    
    <div id="cart-ui" class="cart-ui">
        <div class="cart-content">
            <span class="close-cart" onclick="closeCart()">&times;</span>
            <h2>Your Cart</h2>
            <div id="cart-items">
                <div class="cart-item" th:each="cartItem : ${shoppingItems}" th:id="${cartItem.item.getSKU()}">

                    <img th:src="@{'/' + ${cartItem.item.getProduct().getImageLink()}}">
                    <div>
                        <p th:text="${cartItem.item.getProduct().getDescription()}"></p>
                        <p th:text="'PHP ' + ${cartItem.item.getDiscountedPrice()}"></p>
                        <button th:data-itemSKU="${cartItem.item.getSKU()}" th:onclick="removeFromCart(this.getAttribute('data-itemSKU'))">Remove</button>
                    </div>
                </div>
            </div>
            <button><a href="/shopping-bag">Checkout</a></button>
        </div>
    </div>

    <div id="content">
        <div id="cart-container">
            <h1>Shopping Bag</h1>
            <div class="card" th:each="cartItem : ${shoppingItems}" th:id="${cartItem.getItem().getSKU()}">
                <div>
                    <div>
                        <img th:src="@{'/' + ${cartItem.getItem().getProduct().getImageLink()}}">
                    </div>
                    <div>
                        <p th:text="${cartItem.getItem().getFromCatalog()}"></p>
                        <p th:text="${cartItem.getItem().getProduct().getDescription()}"></p>
                        <button th:id="'removeButton_id' + ${cartItem.getItem().getSKU()}">Remove</button>
                    </div>
                </div>
                <div>
                    <button th:id="'addButton_id' + ${cartItem.getItem().getSKU()}">-</button>
                    <input type="number" th:id="'quantity_id' + ${cartItem.getItem().getSKU()}" th:value="${cartItem.getQuantity()}" min="1">
                    <button th:id="'subButton_id' + ${cartItem.getItem().getSKU()}">+</button>
                </div>
                <div>
                    <p class="if-discount" th:if="${cartItem.getItem().getDiscount() != 0.00}" th:id="'rawPrice_id' + ${cartItem.getItem().getSKU()}" th:text="'PHP ' + ${cartItem.getItem().getPrice()}"></p>
                    <p th:text="'PHP ' + ${cartItem.getItem().getDiscountedPrice()}" th:id="'discountedPrice_id' + ${cartItem.getItem().getSKU()}"></p>
                </div>
            </div>

        </div>
        <div id="order-summary">
            <h1>Order Summary</h1>
            <div th:each="cartItem : ${shoppingItems}" class="order-item" th:id="'orderLine_id' + ${cartItem.getItem().getSKU()}">
                <div>
                    <p class="catalog" th:text="${cartItem.getItem().getFromCatalog()}"></p>
                    <p class="product" th:text="${cartItem.getItem().getProduct().getDescription()}"></p>
                </div>
                <p class="quantity" th:text="'Qty. ' + ${cartItem.getQuantity()}" th:id="'orderLineQty_id' + ${cartItem.getItem().getSKU()}"></p>
                <p class="price" th:text="'PHP ' + ${cartItem.getItem().getDiscountedPrice()}" th:id="'orderLinePrice_id' + ${cartItem.getItem().getSKU()}"></p>
            </div>
        
            <div class="total-container">
                <h3>Total</h3>
                <p class="total" th:text="'PHP ' + ${totalAmount}" id="totalAmt"></p>
            </div>
            
            <button onclick="openPaymentInput()">Check Out</button>
        </div>             
    </div>



    <div id="payment-window">
        <div id="payment-window-content">
            <span class="close" onclick="closePaymentInput()">&times;</span>
    
            <h2>Payment Details</h2>
    
            <h4>Total Amount</h4>
            <span th:text="'PHP ' + ${totalAmount}"></span>
    
            <div id="select-paymethod-container">
                <h4>Select Payment Method</h4>

                <div id="select-paymethod">
                    <label for="check">Check</label>
                    <input type="radio" name="pay-method" id="check" value="check"><br>
    
                    <label for="creditCard">Credit Card</label>
                    <input type="radio" name="pay-method" id="creditCard" value="creditCard">
                </div>
            </div>
    
            <div id="ccp-form-div" class="payment-form">
                <form id="ccp-form" method="POST" action="/order-by-ccp" onsubmit="return validateCCPForm()">
                    <label for="creditCard">Credit Card</label><br>
                    <select id="creditCard" name="creditCard">
                        <!-- <option th:each="ccp : ${credCardOptions}" th:value="${cpp.name()}" th:text="${cpp.getDisplayName()}">VISA</option> -->
                    </select>
    
                    <label for="creditCardNumber">Card number</label><br>
                    <input type="text" id="creditCardNumber" name="creditCardNumber" value="Enter credit card number"><br>
    
                    <label for="cvv">CVV</label><br>
                    <input type="text" id="cvv" name="cvv" value="Enter CVV"><br>
    
                    <label for="cardHolderName">Cardholder name</label><br>
                    <input type="text" id="cardHolderName" name="cardHolderName" value="Enter your name"><br>
    
                    <input type="submit" value="Place Order">
                </form>
            </div>
    
            <div id="cp-form-div" class="payment-form">
                <form id="cp-form" method="POST" action="/order-by-cp" onsubmit="return validateCPForm()">
                    <label for="bank">Bank</label>
                    <select id="bank" name="bank">
                        <!-- <option th:each="bank : ${bankOptions}" th:value="${bank.name()}" th:text="${bank.getDisplayName()}"></option> -->
                    </select>
    
                    <label for="drawer">Drawer</label>
                    <input type="text" id="drawer" name="drawer" value="Enter drawer name"><br>
    
                    <label for="account-num">Account Number</label>
                    <input type="text" id="account-num" name="accountNum" value="Must be 8-12 digits"><br>
    
                    <label for="payee">Payee</label>
                    <input type="text" id="payee" name="payee" value="Direct Clothing" readonly><br>
    
                    <label for="routing-num">Routing Number</label>
                    <input type="text" id="routing-num" name="routingNum" readonly><br>
    
                    <label for="check-num">Check Number</label><br>
                    <input type="text" id="check-num" name="checkNum" th:value="${checkNum}" readonly><br>
    
                    <input type="submit" value="Place Order">
                </form>
            </div>
        </div>
    </div>


    <script src="shoppingbag.js"></script>
</body>
</html>
